[workspace]
members = ["crates/sim", "crates/wasm"]
resolver = "2"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
expect_used = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
too_many_arguments = "warn"
too_many_lines = "warn"
unwrap_used = "warn"
